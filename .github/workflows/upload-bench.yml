name: Doubao Upload Speed Benchmark

on:
  workflow_dispatch:
    inputs:
      size_mb:
        description: 'Test file size in MB (e.g. 200)'
        required: false
        default: '200'

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build alist (linux amd64)
        run: |
          go get github.com/glebarez/sqlite
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags=jsoniter -ldflags="-s -w" -o /tmp/alist-doubao .

      - name: Init alist and set admin password
        run: |
          mkdir -p /tmp/alist
          cd /tmp/alist
          /tmp/alist-doubao admin set aaaaa6 2>&1 | tail -5 || true

      - name: Start alist server
        run: |
          cd /tmp/alist
          nohup /tmp/alist-doubao server > /tmp/alist/server.log 2>&1 &
          sleep 12
          echo "----- server.log -----"
          tail -30 /tmp/alist/server.log
          echo "----- probe -----"
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:5244/api/public/settings

      - name: Benchmark upload to Doubao
        env:
          ADDITION: ${{ secrets.DOUBAO_ADDITION }}
          SIZE_MB: ${{ github.event.inputs.size_mb }}
        run: python3 .github/scripts/bench_upload.py

      - name: Show alist log
        if: always()
        run: tail -80 /tmp/alist/server.log
